name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      # Gate A/B gap (TESTING_STRATEGY.md §8): the DB-backed suites
      # (rls.integration, security/cross-tenant.integration, audit/outbox/
      # tenancy/observability integration, worker dispatcher) SKIP here because
      # there is no Postgres service — they need migrations + TEST_DATABASE_URL.
      # Lint / gitleaks / pnpm audit are also not wired yet. CI scope decision
      # pending with the founder (PROGRESS_TRACKER.md → Next recommended task #3).
